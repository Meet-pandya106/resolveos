version: '3.8'

services:
  resolveos-api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=production
      - PORT=4000
      - DATABASE_URL=postgres://resolveos_user:resolveos_secret@postgres:5432/resolveos
      - JWT_SECRET=resolveos_production_docker_jwt_secret_key_32_chars
      - SESSION_SECRET=resolveos_production_docker_session_secret_key_32_chars
      - CORS_ORIGIN=http://localhost:5173,http://localhost:4000
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:4000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=resolveos_user
      - POSTGRES_PASSWORD=resolveos_secret
      - POSTGRES_DB=resolveos
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U resolveos_user -d resolveos"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
