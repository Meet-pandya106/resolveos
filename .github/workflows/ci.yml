name: ResolveOS CI & Security Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: TypeScript Typecheck
        run: npm run typecheck

      - name: Test Suite (Unit, Integration, Security, E2E)
        run: npm test

      - name: Production Monorepo Build
        run: npm run build

      - name: Master Production Readiness Verification
        run: node scripts/production-readiness-check.cjs

      - name: Package Hygiene & Secrets Audit
        run: node scripts/prepublish-security-check.cjs
